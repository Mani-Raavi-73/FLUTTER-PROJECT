<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/build/web/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Health Profile & Privacy Assistant</title>
  <script>
    // Immediate redirect to the built Flutter web application
    if (!window.location.pathname.startsWith('/build/web')) {
      window.location.replace('/build/web/' + window.location.search + window.location.hash);
    }
  </script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F5F7FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .loading-card {
      background: white;
      padding: 32px 40px;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E3F2FD;
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #2196F3;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="loading-card">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 8px; color: #1E293B;">Opening Application...</h2>
    <p style="margin: 0; color: #64748B; font-size: 14px;">
      If not redirected automatically, <a href="/build/web/">click here to launch</a>.
    </p>
  </div>
</body>
</html>
